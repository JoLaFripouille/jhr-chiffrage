name: Tests Windows et Ubuntu
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bibliothèques graphiques Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python scripts/smoke_server_https.py
      - run: python scripts/build_linux_bundle.py
      - name: Installation Ubuntu isolée
        if: runner.os == 'Linux'
        run: bash installer.sh
